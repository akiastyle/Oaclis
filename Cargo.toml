[package]
name = "oaclis"
version = "0.1.0"
edition = "2024"

[dependencies]
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
tiny_http = "0.12"

regex = "1"
toml = "0.8"
rustpython-parser = { version = "0.4", default-features = false, features = ["num-bigint"] }
rustpython-ast = { version = "0.4", default-features = false, features = ["num-bigint", "visitor"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[build-dependencies]
sha2 = "0.11"
